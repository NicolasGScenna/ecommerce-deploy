services:

  app:
    build: .
    container_name: ecommerce-app
    ports:
      - "3001:3000"
    env_file:
      - .env.development
    depends_on:
      - postgres

  postgres:
    image: postgres
    container_name: ecommerce-postgres
    env_file:
      - .env.development
    ports:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: